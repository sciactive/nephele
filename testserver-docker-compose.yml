services:
  rustfs:
    image: 'rustfs/rustfs'
    restart: on-failure
    ports:
      - '8081:9000'
      - '9001:9001'
    volumes:
      - ./testroot-s3:/data
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=nephele
      - RUSTFS_SECRET_KEY=nephele
  mysql:
    image: 'mysql'
    restart: on-failure
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: nepheleroot
      MYSQL_DATABASE: nephele
      MYSQL_USER: nephele
      MYSQL_PASSWORD: nephele
    volumes:
      - ./testroot-mysql:/var/lib/mysql
